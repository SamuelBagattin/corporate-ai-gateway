external-secrets:
  serviceAccount:
    # Must match the Pod Identity association in terraform/pod_identity.tf.
    name: external-secrets
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      memory: 192Mi
  webhook:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 96Mi
  certController:
    resources:
      requests:
        cpu: 10m
        memory: 48Mi
      limits:
        memory: 128Mi
