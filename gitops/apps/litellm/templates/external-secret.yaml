apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: litellm-secrets
  dataFrom:
    - extract:
        key: {{ .Values.global.secretsPrefix }}/{{ .Values.secretsManagerKey }}
