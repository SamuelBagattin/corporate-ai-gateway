# CNPG generates the "langfuse" role password and writes host/user/password
# to the Secret "langfuse-db-app".
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: langfuse-db
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  instances: {{ .Values.database.instances }}
  storage:
    size: {{ .Values.database.storageSize }}
  bootstrap:
    initdb:
      database: langfuse
      owner: langfuse
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 512Mi
