apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: langfuse-secrets
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: langfuse-secrets
  dataFrom:
    - extract:
        key: {{ .Values.global.secretsPrefix }}/{{ .Values.secretsManagerKey }}
---
# Valkey reads one key per ACL user, so the password is exposed under "default".
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: langfuse-redis-auth
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: langfuse-redis-auth
  data:
    - secretKey: default
      remoteRef:
        key: {{ .Values.global.secretsPrefix }}/{{ .Values.secretsManagerKey }}
        property: redis-password
