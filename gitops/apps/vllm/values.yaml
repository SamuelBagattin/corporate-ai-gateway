image:
  repository: vllm/vllm-openai-cpu
  # v0.31.0/v0.32.0 crash on the first request on CPU without Triton
  # (compute_slot_mapping fallback, fixed by vllm-project/vllm#61992 after
  # v0.32.0). Move up once a release includes that fix.
  tag: v0.30.0-arm64

# Scheduled on the Karpenter "inference" NodePool (Graviton3+).
nodeSelector:
  workload: inference
tolerations:
  - key: workload
    operator: Equal
    value: inference
    effect: NoSchedule

# Each model is reachable in-cluster at http://<name>.vllm.svc:8000/v1 and is
# registered in LiteLLM (gitops/apps/litellm/values.yaml).
models:
  - name: qwen3-0-6b
    model: Qwen/Qwen3-0.6B
    servedModelName: qwen3-0.6b
    replicas: 1
    # KV cache size in GiB (VLLM_CPU_KVCACHE_SPACE); 1 GiB holds ~9k tokens for
    # this model. vLLM checks it against the cgroup limit minus current usage,
    # which includes ~4.3 GiB of process memory and the page cache of the weights.
    kvCacheGiB: 1
    args:
      - --dtype=bfloat16
      - --max-model-len=4096
      # No torch.compile: on arm64 the Inductor C++ build hits a gcc internal
      # compiler error (segfault) during warm-up (seen on vLLM v0.32.0).
      - --enforce-eager
      # OpenAI-style tool calling (LiteLLM agents); Qwen uses the hermes format.
      - --enable-auto-tool-choice
      - --tool-call-parser=hermes
    # Sized to fill a 2 vCPU / 8 GiB node (m7g.large spot, ~0.04 USD/h; ~6.9 GiB allocatable).
    resources:
      requests:
        cpu: 1500m
        memory: 6Gi
      limits:
        memory: 6912Mi
