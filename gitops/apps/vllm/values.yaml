image:
  repository: vllm/vllm-openai-cpu
  tag: v0.32.0-arm64

# Scheduled on the Karpenter "inference" NodePool (Graviton3+).
nodeSelector:
  workload: inference
tolerations:
  - key: workload
    operator: Equal
    value: inference
    effect: NoSchedule

# Each model is reachable in-cluster at http://<name>.vllm.svc:8000/v1 and is
# registered in LiteLLM (gitops/apps/litellm/values.yaml).
models:
  - name: qwen3-0-6b
    model: Qwen/Qwen3-0.6B
    servedModelName: qwen3-0.6b
    replicas: 1
    # KV cache size in GiB (VLLM_CPU_KVCACHE_SPACE). The vLLM process itself
    # takes ~4.3 GiB of the 6 GiB limit; 1 GiB holds ~9k tokens for this model.
    kvCacheGiB: 1
    args:
      - --dtype=bfloat16
      - --max-model-len=4096
      # No torch.compile: on arm64 the Inductor C++ build hits a gcc internal
      # compiler error (segfault) during warm-up (vLLM v0.32.0).
      - --enforce-eager
    # Sized to fit a 2 vCPU / 8 GiB node (m7g.large spot, ~0.04 USD/h).
    resources:
      requests:
        cpu: 1500m
        memory: 5Gi
      limits:
        memory: 6Gi
